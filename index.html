<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KalPay | Premium Retirement Planner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2pdf.js for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        kalpay: { dark: '#0f172a', light: '#f8fafc', primary: '#10b981', secondary: '#4f46e5', accent: '#f59e0b' }
                    }
                }
            }
        }
    </script>
    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        input[type="number"], input[type="date"] {
            transition: all 0.2s;
            background-color: transparent;
        }
    </style>
</head>
<body class="bg-kalpay-light text-slate-800 dark:bg-kalpay-dark dark:text-slate-200 antialiased">

    <!-- Wrapper for PDF Generation -->
    <div id="print-area" class="p-4 md:p-8 bg-kalpay-light dark:bg-kalpay-dark min-h-screen">
        
        <!-- Navbar -->
        <div class="max-w-7xl mx-auto flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-kalpay-secondary to-kalpay-primary flex items-center justify-center text-white font-bold text-xl shadow-lg">K</div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">KalPay <span class="font-light text-slate-500 dark:text-slate-400">Planner</span></h1>
            </div>
            <!-- Theme Toggle (Will be hidden during PDF generation) -->
            <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2.5 rounded-full bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 hover:scale-105 transition print:hidden">
                <svg id="themeIcon" class="w-5 h-5 text-slate-600 dark:text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>

        <div class="max-w-7xl mx-auto">
            <!-- Input Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-8">
                
                <!-- Card 1: Personal Timelines -->
                <div class="glass-card p-6 rounded-2xl shadow-sm">
                    <h3 class="text-lg font-semibold mb-4 text-kalpay-secondary dark:text-indigo-400 border-b border-slate-200 dark:border-slate-700 pb-2">Personal Timelines</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Date of Birth</label>
                            <input type="date" id="dob" value="1993-12-20" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 p-2.5 focus:ring-2 focus:ring-kalpay-primary dark:text-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Age till you Save (Years)</label>
                            <input type="number" id="ageSave" value="40" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 p-2.5 focus:ring-2 focus:ring-kalpay-primary dark:text-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Retirement Age (Years)</label>
                            <input type="number" id="ageRetire" value="45" class="w-full rounded-lg border border-slate-300 dark:border-slate-600 p-2.5 focus:ring-2 focus:ring-kalpay-primary dark:text-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Life Expectancy (Years)</label>
                            <input type="
