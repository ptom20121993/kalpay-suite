<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KalPay | Premium Retirement Planner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2pdf.js for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        kalpay: { 
                            dark: '#0f172a', 
                            light: '#f8fafc', 
                            primary: '#10b981', // Emerald 
                            secondary: '#4f46e5', // Indigo
                            accent: '#f59e0b' // Amber
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            transition: background-color 0.3s ease, color 0.3s ease; 
            -webkit-font-smoothing: antialiased;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: none;
        }
        input[type="number"], input[type="date"] {
            transition: all 0.2s;
            background-color: transparent;
            outline: none;
        }
        /* Hide spinner arrows on number inputs */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-kalpay-light text-slate-800 dark:bg-kalpay-dark dark:text-slate-200 min-h-screen flex flex-col">

    <!-- Wrapper for PDF Generation -->
    <div id="print-area" class="p-4 md:p-8 flex-grow w-full">
        
        <!-- Navbar -->
        <header class="max-w-7xl mx-auto flex justify-between items-center mb-10 border-b border-slate-200 dark:border-slate-800 pb-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-kalpay-secondary to-kalpay-primary flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-kalpay-primary/20">K</div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white leading-tight">KalPay</h1>
                    <span class="font-medium text-slate-500 dark:text-slate-400 text-xs tracking-widest uppercase">Wealth Planner</span>
                </div>
            </div>
            
            <button id="themeToggleBtn" onclick="toggleTheme()" class="p-3 rounded-full bg-white dark:bg-slate-800 shadow-sm border border-slate-200 dark:border-slate-700 hover:scale-105 transition-transform print:hidden focus:ring-2 focus:ring-kalpay-primary">
                <svg id="themeIcon" class="w-5 h-5 text-slate-600 dark:text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </header>

        <main class="max-w-7xl mx-auto">
            
            <!-- Input Grid (Exactly 4 columns on large screens) -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                
                <!-- Card 1: Personal Timelines -->
                <div class="glass-card p-6 rounded-3xl">
                    <div class="flex items-center gap-3 mb-5">
                        <div class="p-2 bg-indigo-50 dark:bg-indigo-900/30 rounded-lg text-kalpay-secondary dark:text-indigo-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Timelines</h3>
                    </div>
                    <div class="space-y-5">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Date of Birth</label>
                            <input type="date" id="dob" value="1993-12-20" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary focus:border-kalpay-primary dark:text-white" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Age till you Save</label>
                            <input type="number" id="ageSave" value="40" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary focus:border-kalpay-primary dark:text-white" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Retirement Age</label>
                            <input type="number" id="ageRetire" value="45" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary focus:border-kalpay-primary dark:text-white" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Life Expectancy</label>
                            <input type="number" id="ageDie" value="75" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary focus:border-kalpay-primary dark:text-white" />
                        </div>
                    </div>
                </div>

                <!-- Card 2: Financial Targets -->
                <div class="glass-card p-6 rounded-3xl">
                    <div class="flex items-center gap-3 mb-5">
                        <div class="p-2 bg-rose-50 dark:bg-rose-900/30 rounded-lg text-rose-500 dark:text-rose-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Assumptions</h3>
                    </div>
                    <div class="space-y-5">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Current Spends (₹)</label>
                            <input type="number" id="currentSpends" value="50000" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary dark:text-white" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-kalpay-primary mb-1.5">Retire Spends (Today's ₹)</label>
                            <input type="number" id="retireSpends" value="50000" class="w-full rounded-xl border-2 border-kalpay-primary/50 p-3 bg-emerald-50 dark:bg-emerald-900/10 focus:ring-2 focus:ring-kalpay-primary dark:text-white font-bold" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Emergency Corpus (₹)</label>
                            <input type="number" id="emergency" value="10000000" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary dark:text-white" />
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Inflation (%)</label>
                                <input type="number" step="0.1" id="inflation" value="7" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary dark:text-white" />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Tax (%)</label>
                                <input type="number" step="0.1" id="tax" value="12.5" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary dark:text-white" />
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card 3: Equity Portfolio -->
                <div class="glass-card p-6 rounded-3xl border-t-4 border-t-kalpay-secondary">
                    <div class="flex items-center gap-3 mb-5">
                        <div class="p-2 bg-indigo-50 dark:bg-indigo-900/30 rounded-lg text-kalpay-secondary dark:text-indigo-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Equity Portfolio</h3>
                    </div>
                    <div class="space-y-5">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Current Corpus (₹)</label>
                            <input type="number" id="currentCorpus" value="100000" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary dark:text-white" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Current Monthly SIP (₹)</label>
                            <input type="number" id="currentSip" value="50000" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary dark:text-white" />
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">SIP Step-Up (%)</label>
                                <input type="number" step="0.1" id="stepUp" value="5" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary dark:text-white" />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Return (%)</label>
                                <input type="number" step="0.1" id="returns" value="10" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary dark:text-white" />
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card 4: EPF Portfolio -->
                <div class="glass-card p-6 rounded-3xl border-t-4 border-t-kalpay-primary">
                    <div class="flex items-center gap-3 mb-5">
                        <div class="p-2 bg-emerald-50 dark:bg-emerald-900/30 rounded-lg text-kalpay-primary dark:text-emerald-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">EPF Portfolio</h3>
                    </div>
                    <div class="space-y-5">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Current EPF Balance (₹)</label>
                            <input type="number" id="epfBalance" value="500000" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary dark:text-white" />
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Your Contri (₹)</label>
                                <input type="number" id="epfEmployee" value="5000" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary dark:text-white" />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Employer (₹)</label>
                                <input type="number" id="epfEmployer" value="5000" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary dark:text-white" />
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Step-up (%)</label>
                                <input type="number" step="0.1" id="epfStepUp" value="5" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary dark:text-white" />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Rate (%)</label>
                                <input type="number" step="0.1" id="epfRate" value="8.25" class="w-full rounded-xl border border-slate-300 dark:border-slate-600 p-3 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-kalpay-primary dark:text-white" />
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-5 mb-10">
                <button onclick="calculatePlan()" class="flex-1 bg-gradient-to-r from-kalpay-secondary to-kalpay-primary text-white font-bold text-xl py-4 px-6 rounded-2xl shadow-xl shadow-kalpay-primary/30 hover:shadow-kalpay-primary/40 hover:-translate-y-1 transition-all duration-300 print:hidden">
                    Run Simulation
                </button>
                <button id="downloadPdfBtn" onclick="downloadPDF()" class="hidden items-center justify-center gap-2 flex-none bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-2 border-slate-200 dark:border-slate-700 font-bold text-xl py-4 px-8 rounded-2xl hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors print:hidden">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export PDF
                </button>
            </div>

            <!-- Results Section -->
            <div id="results" class="hidden opacity-0 transition-opacity duration-700 ease-in-out">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                    
                    <!-- Actionable Insights -->
                    <div class="glass-card p-8 rounded-3xl shadow-sm lg:col-span-1 relative overflow-hidden flex flex-col justify-between border-l-4 border-kalpay-secondary">
                        <div class="absolute top-0 right-0 p-24 bg-kalpay-secondary/5 rounded-full blur-2xl -mr-12 -mt-12"></div>
                        <div class="relative z-10">
                            <p class="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-2">Required Market SIP</p>
                            <p id="resSip" class="text-4xl font-extrabold text-kalpay-secondary dark:text-indigo-400 mb-6 drop-shadow-sm"></p>
                            
                            <p class="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-2">Retirement Expense (At Age <span id="resAgeRetireLabel"></span>)</p>
                            <p id="resExp" class="text-2xl font-bold text-slate-800 dark:text-slate-200 mb-6"></p>
                        </div>
                        <div class="relative z-10 pt-4 border-t border-slate-100 dark:border-slate-800">
                            <p class="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-2">Total Corpus Required</p>
                            <p id="resCorpus" class="text-2xl font-extrabold text-kalpay-primary dark:text-emerald-400"></p>
                        </div>
                    </div>

                    <!-- Comparison Stats -->
                    <div class="glass-card p-8 rounded-3xl shadow-sm lg:col-span-2">
                        <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-6">Trajectory Analysis (Equity + EPF)</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center h-full">
                            <div>
                                <p class="text-slate-500 dark:text-slate-400 mb-2 text-sm font-medium">Projected Wealth on Current Path</p>
                                <p id="resActCorpus" class="text-4xl font-extrabold text-kalpay-accent mb-3 drop-shadow-sm"></p>
                                <p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Calculation includes continuous SIP & EPF.</p>
                            </div>
                            <div id="gapContainer" class="p-6 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-700 transition-colors">
                                <p id="resGapLabel" class="text-sm font-semibold mb-2 uppercase tracking-wide"></p>
                                <p id="resGap" class="text-3xl font-extrabold"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Chart -->
                <div class="glass-card p-6 md:p-8 rounded-3xl shadow-sm h-[500px] md:h-[600px] relative w-full mb-10">
                    <canvas id="wealthChart"></canvas>
                </div>
            </div>
            
        </main>
    </div>

    <script>
        // ---------------------------------------------------------
        // Theme & Initialization Logic
        // ---------------------------------------------------------
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeIcon').innerHTML = isDark 
                ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>'
                : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
            if(window.myChart) window.myChart.update();
        }

        // ---------------------------------------------------------
        // Formatters & Helpers
        // ---------------------------------------------------------
        const formatCurrency = (value) => {
            return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(value);
        };

        const getSafeNumber = (id, fallback) => {
            const el = document.getElementById(id);
            if (!el) return fallback;
            const val = parseFloat(el.value);
            return isNaN(val) ? fallback : val;
        };

        // ---------------------------------------------------------
        // PDF Export Logic
        // ---------------------------------------------------------
        function downloadPDF() {
            const btn = document.getElementById('downloadPdfBtn');
            const originalHTML = btn.innerHTML;
            
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 mr-2 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Generating PDF...`;
            document.getElementById('themeToggleBtn').style.display = 'none';
            btn.style.pointerEvents = 'none';

            const element = document.getElementById('print-area');
            const opt = {
                margin:       [0.5, 0.5, 0.5, 0.5],
                filename:     'KalPay_Retirement_Plan.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, windowWidth: 1280 }, 
                jsPDF:        { unit: 'in', format: 'a3', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                document.getElementById('themeToggleBtn').style.display = '';
                btn.innerHTML = originalHTML;
                btn.style.pointerEvents = 'auto';
            }).catch(err => {
                console.error("PDF generation failed:", err);
                btn.innerHTML = originalHTML;
                btn.style.pointerEvents = 'auto';
            });
        }

        // ---------------------------------------------------------
        // Core Mathematical Engine
        // ---------------------------------------------------------
        window.myChart = null;

        function calculatePlan() {
            try {
                // Show PDF Button
                const pdfBtn = document.getElementById('downloadPdfBtn');
                if(pdfBtn) {
                    pdfBtn.classList.remove('hidden');
                    pdfBtn.classList.add('flex');
                }

                // 1. Safe Date & Timelines
                const dobInput = document.getElementById('dob');
                const dobDate = (dobInput && dobInput.value) ? new Date(dobInput.value) : new Date('1993-12-20');
                const today = new Date();
                
                let currentAge = (today - dobDate) / (1000 * 60 * 60 * 24 * 365.25);
                if (isNaN(currentAge) || currentAge < 0 || currentAge > 100) currentAge = 30; // Fallback
                
                const ageSave = getSafeNumber('ageSave', 40);
                const ageRetire = getSafeNumber('ageRetire', 45);
                const ageDie = getSafeNumber('ageDie', 75);

                const yearsToRetire = Math.max(0, ageRetire - currentAge);
                const monthsToSave = Math.max(0, Math.floor((ageSave - currentAge) * 12));
                const monthsToGrow = Math.max(0, Math.floor((ageRetire - ageSave) * 12));
                const monthsInRetirement = Math.max(0, Math.floor((ageDie - ageRetire) * 12));

                // 2. Safe Financial Parameters
                const retireSpends = getSafeNumber('retireSpends', 50000);
                const emergency = getSafeNumber('emergency', 10000000);
                const inflation = getSafeNumber('inflation', 7) / 100;
                const tax = getSafeNumber('tax', 12.5) / 100;
                
                const returnsGross = getSafeNumber('returns', 10) / 100;
                const returnsNet = returnsGross * (1 - tax);
                const monthlyReturn = returnsNet / 12;

                const currentCorpus = getSafeNumber('currentCorpus', 100000);
                const currentSipInput = getSafeNumber('currentSip', 50000);
                const stepUp = getSafeNumber('stepUp', 5) / 100;

                const epfBalance = getSafeNumber('epfBalance', 500000);
                const initialEpfContri = getSafeNumber('epfEmployee', 5000) + getSafeNumber('epfEmployer', 5000);
                const epfStepUp = getSafeNumber('epfStepUp', 5) / 100;
                const epfRate = getSafeNumber('epfRate', 8.25) / 100;
                const epfMonthlyRate = epfRate / 12; 

                // 3. Goal Calculation (What you need at retirement)
                const monthlySpendsAtRetire = retireSpends * Math.pow(1 + inflation, yearsToRetire);
                
                let lowCorpus = 0, highCorpus = 2000000000, requiredBaseCorpus = 0;
                for (let i = 0; i < 60; i++) {
                    requiredBaseCorpus = (lowCorpus + highCorpus) / 2;
                    let bal = requiredBaseCorpus;
                    let exp = monthlySpendsAtRetire;
                    for (let m = 1; m <= monthsInRetirement; m++) {
                        bal -= exp;
                        if (bal < 0) { bal = -1; break; } // Fail fast
                        bal *= (1 + monthlyReturn);
                        if (m % 12 === 0) exp *= (1 + inflation);
                    }
                    if (bal >= 0) highCorpus = requiredBaseCorpus;
                    else lowCorpus = requiredBaseCorpus;
                }
                const totalTargetCorpus = requiredBaseCorpus + emergency;

                // 4. EPF Autonomous Growth
                let epfBalSim = epfBalance;
                let currentEpfContri = initialEpfContri;
                let testDateEpf = new Date(today);
                
                for (let m = 0; m < monthsToSave; m++) {
                    if (m > 0 && testDateEpf.getMonth() === 3) currentEpfContri *= (1 + epfStepUp);
                    epfBalSim += currentEpfContri;
                    epfBalSim *= (1 + epfMonthlyRate);
                    testDateEpf.setMonth(testDateEpf.getMonth() + 1);
                }
                for (let m = 0; m < monthsToGrow; m++) {
                    epfBalSim *= (1 + epfMonthlyRate);
                }
                const epfAtRetirement = epfBalSim;

                // 5. Equity SIP Required (Gap Fill)
                const targetEquityCorpus = totalTargetCorpus - epfAtRetirement;
                let requiredSip = 0;
                
                if (targetEquityCorpus > 0) {
                    let lowSip = 0, highSip = targetEquityCorpus; 
                    for (let i = 0; i < 60; i++) {
                        requiredSip = (lowSip + highSip) / 2;
                        let bal = currentCorpus;
                        let testSip = requiredSip;
                        let testDate = new Date(today);
                        for (let m = 0; m < monthsToSave; m++) {
                            if (m > 0 && testDate.getMonth() === 3) testSip *= (1 + stepUp);
                            bal += testSip;
                            bal *= (1 + monthlyReturn);
                            testDate.setMonth(testDate.getMonth() + 1);
                        }
                        for (let m = 0; m < monthsToGrow; m++) bal *= (1 + monthlyReturn);
                        
                        if (bal < targetEquityCorpus) lowSip = requiredSip;
                        else highSip = requiredSip;
                    }
                }

                // 6. Timeline Arrays generation
                let chartLabels = [], dataTarget = [], dataActual = [];
                let balTargetEq = currentCorpus, balActualEq = currentCorpus;
                let balEpfTarget = epfBalance, balEpfActual = epfBalance;
                let simSipTarget = requiredSip, simSipActual = currentSipInput;
                let simContriEpf = initialEpfContri;
                let simDate = new Date(today);

                for (let m = 0; m <= monthsToSave; m++) {
                    if (m % 12 === 0 || m === monthsToSave) {
                        chartLabels.push((currentAge + m/12).toFixed(1));
                        dataTarget.push(balTargetEq + balEpfTarget);
                        dataActual.push(balActualEq + balEpfActual);
                    }
                    if (m < monthsToSave) {
                        if (m > 0 && simDate.getMonth() === 3) {
                            simSipTarget *= (1 + stepUp);
                            simSipActual *= (1 + stepUp);
                            simContriEpf *= (1 + epfStepUp);
                        }
                        balTargetEq += simSipTarget;
                        balActualEq += simSipActual;
                        balEpfTarget += simContriEpf;
                        balEpfActual += simContriEpf;
                        
                        balTargetEq *= (1 + monthlyReturn);
                        balActualEq *= (1 + monthlyReturn);
                        balEpfTarget *= (1 + epfMonthlyRate);
                        balEpfActual *= (1 + epfMonthlyRate);
                        simDate.setMonth(simDate.getMonth() + 1);
                    }
                }

                for (let m = 1; m <= monthsToGrow; m++) {
                    balTargetEq *= (1 + monthlyReturn);
                    balActualEq *= (1 + monthlyReturn);
                    balEpfTarget *= (1 + epfMonthlyRate);
                    balEpfActual *= (1 + epfMonthlyRate);
                    if (m % 12 === 0 || m === monthsToGrow) {
                        chartLabels.push((ageSave + m/12).toFixed(1));
                        dataTarget.push(balTargetEq + balEpfTarget);
                        dataActual.push(balActualEq + balEpfActual);
                    }
                }
                
                const actualCorpusAtRetirement = balActualEq + balEpfActual;

                let combinedTarget = balTargetEq + balEpfTarget;
                let combinedActual = actualCorpusAtRetirement;
                let wTarget = monthlySpendsAtRetire;
                let wActual = monthlySpendsAtRetire;
                
                for (let m = 1; m <= monthsInRetirement; m++) {
                    combinedTarget -= wTarget;
                    combinedActual -= wActual;
                    
                    if (combinedTarget < 0) combinedTarget = 0;
                    if (combinedActual < 0) combinedActual = 0;
                    
                    combinedTarget *= (1 + monthlyReturn);
                    combinedActual *= (1 + monthlyReturn);
                    
                    if (m % 12 === 0) {
                        wTarget *= (1 + inflation);
                        wActual *= (1 + inflation);
                    }
                    
                    if (m % 12 === 0 || m === monthsInRetirement) {
                        chartLabels.push((ageRetire + m/12).toFixed(1));
                        dataTarget.push(combinedTarget);
                        dataActual.push(combinedActual);
                    }
                }

                // 7. Render UI Safely
                const resultsBlock = document.getElementById('results');
                resultsBlock.classList.remove('hidden');
                setTimeout(() => resultsBlock.classList.remove('opacity-0'), 50);

                const setVal = (id, val) => { const el = document.getElementById(id); if(el) el.innerText = val; };
                
                setVal('resExp', formatCurrency(monthlySpendsAtRetire) + ' / mo');
                setVal('resCorpus', formatCurrency(totalTargetCorpus));
                setVal('resSip', formatCurrency(requiredSip) + ' / mo');
                setVal('resAgeRetireLabel', ageRetire);
                setVal('resActCorpus', formatCurrency(actualCorpusAtRetirement));

                const gap = totalTargetCorpus - actualCorpusAtRetirement;
                const gapEl = document.getElementById('resGap');
                const gapLabel = document.getElementById('resGapLabel');
                const gapContainer = document.getElementById('gapContainer');
                
                if (gap > 0) {
                    gapEl.innerText = formatCurrency(gap) + ' (Shortfall)';
                    gapEl.className = 'text-3xl font-extrabold text-rose-500 dark:text-rose-400';
                    gapLabel.innerText = 'Wealth Shortfall';
                    gapLabel.className = 'text-sm font-semibold mb-2 uppercase tracking-wide text-rose-600 dark:text-rose-300';
                    gapContainer.className = 'p-6 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-100 dark:border-rose-900/50 transition-colors';
                } else {
                    gapEl.innerText = formatCurrency(Math.abs(gap)) + ' (Surplus)';
                    gapEl.className = 'text-3xl font-extrabold text-kalpay-primary dark:text-emerald-400';
                    gapLabel.innerText = 'Wealth Surplus';
                    gapLabel.className = 'text-sm font-semibold mb-2 uppercase tracking-wide text-emerald-700 dark:text-emerald-300';
                    gapContainer.className = 'p-6 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-100 dark:border-emerald-900/50 transition-colors';
                }

                renderChart(chartLabels, dataTarget, dataActual);

            } catch (error) {
                console.error("Critical calculation error:", error);
            }
        }

        // ---------------------------------------------------------
        // Chart Render Logic
        // ---------------------------------------------------------
        function renderChart(labels, targetData, actualData) {
            const ctxEl = document.getElementById('wealthChart');
            if (!ctxEl || typeof Chart === 'undefined') return; // Safe fallback
            
            const ctx = ctxEl.getContext('2d');
            if (window.myChart) window.myChart.destroy();

            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#cbd5e1' : '#475569';
            const gridColor = isDark ? 'rgba(255,255,255,0.05)' : '#f1f5f9';

            let gradTarget = ctx.createLinearGradient(0, 0, 0, 400);
            gradTarget.addColorStop(0, 'rgba(16, 185, 129, 0.25)');
            gradTarget.addColorStop(1, 'rgba(16, 185, 129, 0)');

            let gradActual = ctx.createLinearGradient(0, 0, 0, 400);
            gradActual.addColorStop(0, 'rgba(245, 158, 11, 0.25)');
            gradActual.addColorStop(1, 'rgba(245, 158, 11, 0)');

            window.myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Target Path (Req. SIP + EPF)',
                            data: targetData,
                            borderColor: '#10b981', 
                            backgroundColor: gradTarget,
                            borderWidth: 3.5,
                            fill: true,
                            pointRadius: 0,
                            pointHoverRadius: 7,
                            tension: 0.3
                        },
                        {
                            label: 'Actual Path (Cur. SIP + EPF)',
                            data: actualData,
                            borderColor: '#f59e0b', 
                            backgroundColor: gradActual,
                            borderWidth: 3.5,
                            borderDash: [6, 6],
                            fill: true,
                            pointRadius: 0,
                            pointHoverRadius: 7,
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 600 }, 
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: true, position: 'top', labels: { color: textColor, usePointStyle: true, boxWidth: 10, padding: 25, font: { family: 'Outfit', size: 14, weight: '500' } } },
                        tooltip: {
                            backgroundColor: isDark ? 'rgba(15, 23, 42, 0.95)' : 'rgba(255, 255, 255, 0.95)',
                            titleColor: isDark ? '#f8fafc' : '#0f172a',
                            bodyColor: isDark ? '#cbd5e1' : '#475569',
                            borderColor: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)',
                            borderWidth: 1,
                            padding: 16,
                            titleFont: { size: 0 }, 
                            bodyFont: { family: 'Outfit', size: 15, weight: '500' },
                            callbacks: {
                                title: () => null,
                                label: function(context) {
                                    const corpus = formatCurrency(context.raw);
                                    const age = context.label;
                                    const datasetLabel = context.dataset.label.split('(')[0].trim();
                                    return `${datasetLabel}: ${corpus}, ${age} yrs`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { 
                            title: { display: true, text: 'Age (Years)', color: textColor, font: { family: 'Outfit', size: 13, weight: '600', tracking: 'wide' } },
                            grid: { display: false },
                            ticks: { color: textColor, font: { family: 'Outfit' } }
                        },
                        y: { 
                            title: { display: true, text: 'Consolidated Wealth (₹)', color: textColor, font: { family: 'Outfit', size: 13, weight: '600', tracking: 'wide' } },
                            border: { dash: [4, 4], display: false },
                            grid: { color: gridColor },
                            ticks: {
                                color: textColor,
                                font: { family: 'Outfit', size: 13 },
                                padding: 10,
                                callback: function(value) {
                                    if (value >= 10000000) return '₹' + (value / 10000000).toFixed(1) + ' Cr';
                                    if (value >= 100000) return '₹' + (value / 100000).toFixed(0) + ' L';
                                    return '₹' + value;
                                }
                            }
                        }
                    }
                }
            });
        }
        
        // Auto-run when the DOM is painted safely
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(calculatePlan, 200);
        });
    </script>
</body>
